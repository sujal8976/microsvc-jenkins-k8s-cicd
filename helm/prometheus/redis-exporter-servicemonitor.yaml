apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: monitoring
spec:
  selector:
    matchLabels:
      app: redis-exporter

  namespaceSelector:
    matchNames:
      - monitoring

  endpoints:
  - port: metrics
    interval: 15s

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-service-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: monitoring
spec:
  groups:
    - name: app-service.rules
      rules:
        - alert: AppServiceHigh5xxRate
          expr: |
            (
              sum(rate(app_service_http_requests_total{status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(app_service_http_requests_total[5m])), 0.1)
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            service: app-service
            namespace: microservices
          annotations:
            summary: App service has high 5xx error rate
            description: |
              More than 5% of app-service requests are failing with 5xx over the last 5 minutes.
              VALUE = {{ $value }}

        - alert: AppServiceHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(app_service_http_request_duration_seconds_bucket[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
            service: app-service
            namespace: microservices
          annotations:
            summary: App service p95 latency is high
            description: |
              p95 latency for app-service is above 1 second for at least 10 minutes.
              VALUE = {{ $value }}

        - alert: AppServiceCriticalLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(app_service_http_request_duration_seconds_bucket[5m]))
            ) > 2
          for: 5m
          labels:
            severity: critical
            service: app-service
            namespace: microservices
          annotations:
            summary: App service p95 latency is critically high
            description: |
              p95 latency for app-service is above 2 seconds for at least 5 minutes.
              VALUE = {{ $value }}

        - alert: AppServiceNoTraffic
          expr: sum(rate(app_service_http_requests_total[10m])) < 0.01
          for: 15m
          labels:
            severity: warning
            service: app-service
            namespace: microservices
          annotations:
            summary: App service is receiving almost no traffic
            description: |
              Request rate has been near zero for 15 minutes.
              VALUE = {{ $value }}
